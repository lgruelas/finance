[flake8]
max-line-length = 120
exclude =
    */migrations/*
ignore = E251

[coverage:run]
source = .
omit =
    */migrations/*
    manage.py
branch = True

[coverage:report]
fail_under = 90
show_missing = True
skip_covered = True

[tool:pytest]
DJANGO_SETTINGS_MODULE = backend.settings.test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
